<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAILSIGHT | Operational Intelligence & Live Corridor Tracker</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <header>
    <div class="brand">
      <h1>RAILSIGHT</h1>
      <p>Independent Operational Intelligence &amp; Live Status Corridor Tracker</p>
    </div>
    <div class="header-controls">
      <span class="pill-badge" id="syncClock">Live Sync IST: --:--:--</span>
      <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">☀ Light Mode</button>
    </div>
  </header>

  <div class="container">
    <section class="search-panel">
      <div class="field">
        <label for="sourceInput">Source Station (IRCTC Code)</label>
        <input id="sourceInput" list="stationList" value="MAQ" placeholder="e.g. MAQ, MAJN, CLT" />
      </div>
      <button class="btn-swap" title="Swap Stations" onclick="swapStations()">⇄</button>
      <div class="field">
        <label for="destInput">Destination Station (IRCTC Code)</label>
        <input id="destInput" list="stationList" value="CLT" placeholder="e.g. CLT, CAN, KGQ" />
      </div>
      <div class="field-sm">
        <label for="windowSelect">Horizon Window</label>
        <select id="windowSelect" onchange="fetchTrains()">
          <option value="24" selected>24-Hour Master Grid</option>
          <option value="3">Next 3-Hour Commuter Window</option>
        </select>
      </div>
      <div class="field-sm">
        <label for="daySelect">ML Crowd Day Profile</label>
        <select id="daySelect" onchange="fetchTrains()">
          <option value="">Auto (Today IST)</option>
          <option value="0">Monday (Peak Surge)</option>
          <option value="2">Wednesday (Midweek)</option>
          <option value="4">Friday (Weekend Rush)</option>
          <option value="6">Sunday (Off-Peak)</option>
        </select>
      </div>
      <button class="btn-primary" onclick="fetchTrains()">Scan Corridor</button>
      <datalist id="stationList"></datalist>
    </section>

    <div class="corridor-strip">
      <span id="corridorSummary">Corridor Path: Loading...</span>
      <span id="trainCountBadge">Active Unreserved Rakes: 0</span>
    </div>

    <main class="grid" id="trainGrid"></main>
  </div>

  <script>
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("railsight-theme", theme);
      document.getElementById("themeToggle").textContent = theme === "dark" ? "☀ Light Mode" : "🌙 Dark Mode";
    }
    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme");
      applyTheme(current === "dark" ? "light" : "dark");
    }
    applyTheme(localStorage.getItem("railsight-theme") || "dark");

    function parseStationCode(val) {
      return val.trim().split(/[\s-]+/).toUpperCase();
    }

    function swapStations() {
      const s = document.getElementById("sourceInput");
      const d = document.getElementById("destInput");
      [s.value, d.value] = [d.value, s.value];
      fetchTrains();
    }

    async function loadStations() {
      try {
        const res = await fetch("/api/stations");
        if (!res.ok) return;
        const stations = await res.json();
        document.getElementById("stationList").innerHTML =
          stations.map(st => `<option value="${st.station_code} - ${st.station_name}"></option>`).join("");
      } catch (e) {}
    }

    async function fetchTrains() {
      const src = parseStationCode(document.getElementById("sourceInput").value || "MAQ");
      const dst = parseStationCode(document.getElementById("destInput").value || "CLT");
      const win = document.getElementById("windowSelect").value;
      const dow = document.getElementById("daySelect").value;

      let url = `/api/trains?source=${encodeURIComponent(src)}&dest=${encodeURIComponent(dst)}&window_hours=${win}`;
      if (dow !== "") url += `&day_of_week=${dow}`;

      const grid = document.getElementById("trainGrid");
      grid.innerHTML = `<p style="padding:20px;color:var(--text-secondary)">Scanning corridor telemetry...</p>`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) {
          grid.innerHTML = `<p style="padding:20px;color:var(--crit-text)">${data.detail || "Error loading corridor"}</p>`;
          return;
        }

        document.getElementById("syncClock").textContent = `Live Sync IST: ${data.server_time_ist}`;
        document.getElementById("corridorSummary").innerHTML =
          `Corridor Path: <strong>${data.source.station_name} (${data.source.station_code}) &rarr; ${data.dest.station_name} (${data.dest.station_code})</strong> &bull; Distance: <strong>${data.distance_km} km</strong>`;
        document.getElementById("trainCountBadge").textContent = `Unreserved Rakes Found: ${data.count}`;

        if (data.trains.length === 0) {
          grid.innerHTML = `<p style="padding:20px;color:var(--text-secondary)">No unreserved trains found in this window. Switch to 24-Hour Master Grid.</p>`;
          return;
        }

        grid.innerHTML = data.trains.map(t => `
          <article class="card">
            <div>
              <div class="card-top">
                <div>
                  <div class="train-title">${t.train_name}</div>
                  <span class="rake-badge">${t.rake_badge}</span>
                </div>
                <span class="train-no">#${t.train_no}</span>
              </div>
              <div class="meta-row">
                <div>
                  <div class="meta-label">Service Tier</div>
                  <div class="meta-val">${t.category_name}</div>
                </div>
                <div style="text-align:right;">
                  <div class="meta-label">Actual Dep ${t.delay_minutes > 0 ? `(+${t.delay_minutes}m)` : ''}</div>
                  <div class="dep-time">${t.actual_dep}</div>
                </div>
              </div>
              <div class="fare-row">
                <span class="meta-label">UTS Counter Fare: </span>
                <span class="fare-val">&#8377;${t.uts_fare.toFixed(2)}</span>
              </div>
              <div class="crowd-box crowd-${t.crowd.level}">
                AI Crowd Forecast (RF): ${t.crowd.label} (${t.crowd.confidence}%)
              </div>
              <div class="timeline">
                <div class="status-note">&bull; Live Track: ${t.live_status_note}</div>
                <ul class="stop-list">
                  ${t.timeline.map(s => `
                    <li class="${s.is_endpoint ? 'endpoint' : ''}">
                      <span class="dot"></span> ${s.station_code} (${s.time})
                    </li>
                  `).join("")}
                </ul>
              </div>
            </div>
            <div class="advisory adv-${t.alert_level}">${t.advisory_text}</div>
          </article>
        `).join("");
      } catch (err) {
        grid.innerHTML = `<p style="padding:20px;color:var(--crit-text)">Network error connecting to backend API.</p>`;
      }
    }

    loadStations().then(fetchTrains);
  </script>
</body>
</html>
